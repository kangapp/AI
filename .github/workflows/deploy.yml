name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      project:
        type: choice
        options:
          - db_query
          - simple_agent
          - gen_slides
          - llm_log_visualizer
          - code_review_agent
          - raflow
        required: true
        description: 选择要部署的项目
  push:
    paths:
      - 'project/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.detect.outputs.project }}
    steps:
      - uses: actions/checkout@v4

      - name: 检测变更项目
        id: detect
        run: |
          if [ "${{ github.event.inputs.project }}" != "" ]; then
            echo "project=${{ github.event.inputs.project }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only ${{ github.event.before }} HEAD | cut -d/ -f2 | sort -u | head -1)
            echo "project=${changed}" >> $GITHUB_OUTPUT
          fi

      - name: 构建 Docker 镜像
        run: |
          docker compose build ${{ steps.detect.outputs.project }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH Action
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/admin/app
            git pull origin master
            docker compose up -d --build ${{ needs.build.outputs.project }}
