name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      project:
        type: choice
        options:
          - db_query
          - simple_agent
          - gen_slides
          - llm_log_visualizer
          - code_review_agent
          - raflow
        required: true
        description: 选择要部署的项目
  push:
    paths:
      - 'project/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测变更项目
        id: detect
        run: |
          if [ "${{ github.event.inputs.project }}" != "" ]; then
            echo "project=${{ github.event.inputs.project }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only ${{ github.event.before }} HEAD | cut -d/ -f2 | sort -u | head -1)
            echo "project=${changed}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH Action
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 添加 GitHub host key
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

            cd /home/admin/app

            # 检查是否是 git 仓库
            if [ ! -d .git ]; then
              # 初始化 git 仓库（保留现有文件如 .env）
              git init
              git remote add origin git@github.com:kangapp/AI.git
              git fetch origin
              git checkout master
            fi

            # 拉取最新代码
            git pull origin master

            # 构建并启动指定项目
            docker compose up -d --build ${{ steps.detect.outputs.project }}
