name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      project:
        type: choice
        options:
          - db_query
          - simple_agent
          - gen_slides
          - llm_log_visualizer
          - code_review_agent
          - raflow
        required: true
        description: 选择要部署的项目
  push:
    paths:
      - 'project/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测/设置项目变量
        id: project
        run: |
          if [ "${{ github.event.inputs.project }}" != "" ]; then
            # workflow_dispatch: 使用选择的项目
            echo "PROJECT=${{ github.event.inputs.project }}" >> $GITHUB_OUTPUT
            echo "Using selected project: ${{ github.event.inputs.project }}"
          else
            # push: 自动检测变更的项目
            changed=$(git diff --name-only ${{ github.event.before }} HEAD | cut -d/ -f2 | sort -u | head -1)
            echo "PROJECT=${changed}" >> $GITHUB_OUTPUT
            echo "Auto-detected project: ${changed}"
          fi

      - name: Deploy via SSH Action
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30m
          script: |
            # 1. 尝试进入目录
            cd /home/admin/app || { echo "错误: 目录不存在"; exit 1; }

            # 2. 检查当前是否是 Git 目录
            if [ ! -d ".git" ]; then
              echo "错误: 当前目录不是 Git 仓库，请先在服务器上手动 git clone"
              exit 1
            fi

            # 3. 检查 Compose 文件是否存在
            if [ ! -f "docker-compose.yml" ]; then
              echo "错误: 找不到 docker-compose.yml 文件"
              exit 1
            fi

            # 4. 执行更新
            git pull origin master
            docker compose up -d --build ${{ steps.project.outputs.PROJECT }}
            docker image prune -f
