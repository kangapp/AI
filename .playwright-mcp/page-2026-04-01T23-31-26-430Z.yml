                - paragraph [ref=e241]: Unlike traditional BI, customer-facing analytics is built directly into your product for end users. This embedded analytics solution delivers real-time, low-latency insights at scale — think milliseconds, not minutes — powered by a columnar database that handles thousands to millions of concurrent queries. MotherDuck's architecture, from Hypertenancy to Wasm support, is designed for Customer-Facing Analytics that drives user engagement directly in your app.
