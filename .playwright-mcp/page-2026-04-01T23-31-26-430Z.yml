              - heading "Hypertenancy and vertical scaling" [level=3] [ref=e537]
              - paragraph [ref=e538]: MotherDuck's cloud data warehouse employs a Hypertenancy and vertical scaling strategy. Users connect to their own MotherDuck Ducklings (DuckDB instances), which are sized (pulse, standard, jumbo, mega, giga) to meet their specific needs. There is also the option for additional Ducklings, through read scaling (explained below), to ensure flexible resource allocation. Ultimately, each Duckling establishes a connection with the central data warehouse storage.
              - link "Learn more" [ref=e540] [cursor=pointer]:
                - /url: /product/hypertenancy/
                - generic [ref=e541]: Learn more
            - img [ref=e543]
          - generic [ref=e544]:
            - generic [ref=e545]:
              - heading "Read Scaling" [level=3] [ref=e546]
              - paragraph [ref=e547]: MotherDuck's read scaling capabilities allow users to connect via a BI Tool to dedicated Ducklings that function as read replicas. These read replicas can be provisioned in various sizes (pulse, standard, jumbo, mega or giga) to accommodate different needs. Ultimately, these read replicas connect to the Data Warehouse storage, enabling efficient handling of read operations.
            - img [ref=e549]
